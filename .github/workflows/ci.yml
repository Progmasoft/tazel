name: CI

on:
  pull_request:
  # The default branch only. A branch that has a pull request is tested by
  # the pull request; testing its pushes as well ran every job twice.
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Gradle check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Spotless, the Kotlin compiler with warnings as errors, and every test.
      - name: Check
        shell: bash
        run: ./gradlew check --no-daemon

  helpers:
    name: Developer script
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"

      # The runner image ships the kotlin launcher. Compiling the script proves
      # it still builds; the version check keeps build.gradle.kts and the
      # changelog in step.
      - name: Check the host and the release metadata
        shell: bash
        run: |
          kotlin -version
          kotlin helpers/develop.main.kts doctor
          kotlin helpers/develop.main.kts version

  required:
    name: CI Required
    runs-on: ubuntu-26.04
    if: always()
    needs: [check, helpers]
    steps:
      - name: Require every job
        run: |
          test '${{ needs.check.result }}' = success
          test '${{ needs.helpers.result }}' = success
